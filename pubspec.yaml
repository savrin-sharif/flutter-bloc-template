# Package
name: flutter_bloc_template
description: A versatile clean-architecture Flutter template using BLoC.
publish_to: none
version: 1.0.0+1

# SDK
environment:
  sdk: ^3.14.0

# Application dependencies
dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.11.1
  cupertino_ui: ^1.1.7
  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  equatable: ^2.1.0
  go_router: ^18.1.4
  get_it: ^9.3.0
  dio: ^5.11.1
  connectivity_plus: ^7.3.2
  flutter_dotenv: ^6.0.2

# Development dependencies
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.5

# Flutter
flutter:
  uses-material-design: true
  assets:
    - assets/envs/
