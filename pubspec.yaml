# Package
name: flutter_bloc_template
description: A versatile clean-architecture Flutter template using BLoC.
publish_to: none
version: 1.0.0+1

# SDK
environment:
  sdk: ^3.12.0

# Application dependencies
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  equatable: ^2.1.0
  go_router: ^17.3.0
  get_it: ^9.2.1
  dio: ^5.10.0
  connectivity_plus: ^7.3.0
  flutter_dotenv: ^6.0.1

# Development dependencies
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.5

# Flutter
flutter:
  uses-material-design: true
  assets:
    - assets/envs/
